name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: macos-15
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: make release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: logpipe-${{ matrix.target }}
          path: bin/release/logpipe-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: logpipe-*
          path: bin/release
          merge-multiple: true

      - name: Generate checksums
        working-directory: bin/release
        run: sha256sum logpipe-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/release/*
          generate_release_notes: true
