[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logpipe"
version = "0.1.0"
description = "Python SDK for sending logs to logpipe server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Logpipe Team" }
]
keywords = ["logging", "observability", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/logpipe/logpipe"
Documentation = "https://github.com/logpipe/logpipe#readme"
Repository = "https://github.com/logpipe/logpipe"

[project.scripts]
logpipe-k8s = "logpipe.k8s_forwarder:main"

[tool.hatch.build.targets.wheel]
packages = ["logpipe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
